name: watchlog
services:
  watchlog-cinema:
    container_name: watchlog-cinema
    image: scene:local
    build:
      context: .
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:4317:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/cinema.db"
      DATA_DIR: "/app/data"
      APP_URL: "${APP_URL:?Set APP_URL in .env}"
      DISABLE_BACKGROUND_WORKER: "false"
      SOURCE_ARCHIVE_MODE: "false"
    volumes:
      - ./data:/app/data
    networks:
      - proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
networks:
  proxy:
    external: true
    name: ${SCENE_PROXY_NETWORK:-scene_proxy}
